services:
  postgres:
    image: postgres:16-alpine
    container_name: rare-postgres
    restart: always
    environment:
      POSTGRES_DB: rare_drupal
      POSTGRES_USER: rare_user
      POSTGRES_PASSWORD: rare_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # We use 5433 so it never conflicts

  drupal:
    image: drupal:10.3-php8.3-apache
    container_name: rare-drupal
    restart: always
    depends_on:
      - postgres
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
    volumes:
      - ./web:/var/www/html
    ports:
      - "8080:80"
    command: >
      bash -c "apt-get update && apt-get install -y git unzip && 
               composer self-update && 
               chown -R www-data:www-data /var/www/html && 
               apache2-foreground"

volumes:
  postgres_data: