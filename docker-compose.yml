services:
  postgres:
    image: postgres:16-alpine
    container_name: rare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rare_drupal}
      POSTGRES_USER: ${POSTGRES_USER:-rare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - marketplace-net

  drupal:
    build: .
    image: rareimagery-drupal:latest
    container_name: rare-drupal
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
      - POSTGRES_DB=${POSTGRES_DB:-rare_drupal}
      - POSTGRES_USER=${POSTGRES_USER:-rare_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - XAI_API_KEY=${XAI_API_KEY}
      - X_BEARER_TOKEN=${X_BEARER_TOKEN}
      - X_CONSUMER_KEY=${X_CONSUMER_KEY}
      - X_CONSUMER_SECRET=${X_CONSUMER_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PRINTFUL_API_KEY=${PRINTFUL_API_KEY}
      - PRINTFUL_WEBHOOK_SECRET=${PRINTFUL_WEBHOOK_SECRET}
    volumes:
      - ./web:/var/www/html
    ports:
      - "${DRUPAL_PORT:-80}:80"
    command: >
      bash -c "chown -R www-data:www-data /var/www/html &&
               apache2-foreground"
    networks:
      - marketplace-net

networks:
  marketplace-net:
    driver: bridge

volumes:
  postgres_data:
